<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Recognition</title>
    <link
      rel="icon"
      href="https://img.freepik.com/premium-vector/abstract-facial-recognition-blue-background_23-2148209493.jpg?w=360"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      :root {
        margin: 0;
        padding: 0;
      }
      .footer {
        display: flex;
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        text-align: center;
        padding: 10px 0;
        align-items: bottom;
        justify-content: center;
      }
      body {
        font-family: Arial, sans-serif;
        padding-top: 10px;
        width: 100%;
        height: 100vh;
        background-repeat: no-repeat;
        background-size: cover;
        background-image: url("https://www.joonsquare.com/usermanage/image/business/nirmala-matha-convent-mat-hr-sec-school-coimbatore-9220/nirmala-matha-convent-mat-hr-sec-school-coimbatore-nirmala-matha-matric-hr-sec-school-5.jpg");
      }
      form {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
      }
      form input[type="file"] {
        margin-right: 10px;
      }
      form img {
        margin-left: 10px;
        max-width: 100px;
        max-height: 100px;
        display: none; /* Initially hidden */
      }
      p {
        padding: 10px;
        border-radius: 5px;
      }
      .message-success {
        color: green;
        background-color: #e0f7e0;
        border: 1px solid green;
      }
      .message-error {
        color: red;
        background-color: #f7e0e0;
        border: 1px solid red;
      }
      .base {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="base">
      <h1>Nirmala Matha Convent Matriculation Higher Secondary school</h1>
      <h2 class="heading">Face Authentication System</h2>
      <form id="upload-form">
        <input type="file" id="file-upload" />
        <img id="upload-preview" />
        <button type="submit">Upload</button>
      </form>
      <form id="recognize-form">
        <input type="file" id="file-recognize" />
        <img id="recognize-preview" />
        <button type="submit">Recognize</button>
      </form>
      <p id="message"></p>
    </div>
    <footer class="footer">
      <h3>&copy; Sharathi V. 12-A</h3>
    </footer>

    <script>
      document.getElementById("file-upload").addEventListener("change", (e) => {
        const file = e.target.files[0];
        const preview = document.getElementById("upload-preview");
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            preview.src = event.target.result;
            preview.style.display = "block";
          };
          reader.readAsDataURL(file);
        } else {
          preview.style.display = "none";
        }
      });

      document
        .getElementById("file-recognize")
        .addEventListener("change", (e) => {
          const file = e.target.files[0];
          const preview = document.getElementById("recognize-preview");
          if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
              preview.src = event.target.result;
              preview.style.display = "block";
            };
            reader.readAsDataURL(file);
          } else {
            preview.style.display = "none";
          }
        });

      document
        .getElementById("upload-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const fileInput = document.getElementById("file-upload");
          const file = fileInput.files[0];
          const messageElement = document.getElementById("message");
          messageElement.classList.remove("message-success", "message-error");

          if (!file) {
            messageElement.textContent = "Please select a file to upload";
            messageElement.classList.add("message-error");
            return;
          }
          const formData = new FormData();
          formData.append("file", file);
          try {
            const res = await axios.post("/upload", formData, {
              headers: {
                "Content-Type": "multipart/form-data",
              },
            });
            messageElement.textContent = res.data.message;
            messageElement.classList.add("message-success");
          } catch (err) {
            messageElement.textContent = "Error uploading file";
            messageElement.classList.add("message-error");
          }
        });

      document
        .getElementById("recognize-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const fileInput = document.getElementById("file-recognize");
          const file = fileInput.files[0];
          const messageElement = document.getElementById("message");
          messageElement.classList.remove("message-success", "message-error");

          if (!file) {
            messageElement.textContent = "Please select a file to recognize";
            messageElement.classList.add("message-error");
            return;
          }
          const formData = new FormData();
          formData.append("file", file);
          try {
            const res = await axios.post("/recognize", formData, {
              headers: {
                "Content-Type": "multipart/form-data",
              },
            });
            if (res.status === 200) {
              messageElement.textContent = `Face-Match`;
              messageElement.classList.add("message-success");
            } else {
              messageElement.textContent = res.data.message;
              messageElement.classList.add("message-error");
            }
          } catch (err) {
            messageElement.textContent = "Face-Mismatch";
            messageElement.classList.add("message-error");
          }
        });
    </script>
  </body>
</html>
